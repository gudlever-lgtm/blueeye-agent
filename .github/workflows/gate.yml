# Pre-build gate — runs on every branch push and every pull request, so no
# branch build exists without the security / ui / validation tests passing.
# Same script as the local git pre-push hook and Claude Code's git-push hook.
name: gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    name: security / ui / validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/gate.sh --force

  # The Go rewrite (blueeye-agent-go/) has its own test suite, which nothing
  # ran before. A separate job so a Go failure is named as one, and so the
  # Node gate above does not need a Go toolchain. Not in scripts/gate.sh: the
  # local hook must not require Go on every contributor's machine.
  go:
    name: Go agent vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blueeye-agent-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: blueeye-agent-go/go.mod
          cache-dependency-path: blueeye-agent-go/go.sum
      - run: go vet ./...
      - run: go test ./...
